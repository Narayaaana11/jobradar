<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radar Sweep Glow Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Radial Center Light -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

  <!-- Radar Concentric Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#27272a" stroke-width="5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="125" fill="none" stroke="#3f3f46" stroke-width="6"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#71717a" stroke-width="6"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="76" x2="256" y2="436" stroke="#27272a" stroke-width="4"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="#27272a" stroke-width="4"/>

  <!-- Radar Sweep Sector (45 degree scanner cone) -->
  <path d="M 256 256 L 376 136 A 170 170 0 0 0 256 86 Z" fill="url(#radarSweep)" />

  <!-- Radar Sweep Line -->
  <line x1="256" y1="256" x2="376" y2="136" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Active Job Detected Blips -->
  <circle cx="340" cy="180" r="10" fill="#38bdf8" />
  <circle cx="340" cy="180" r="18" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>

  <circle cx="180" cy="200" r="8" fill="#10b981" />
  <circle cx="180" cy="200" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5"/>

  <circle cx="290" cy="330" r="7" fill="#a855f7" opacity="0.8"/>

  <!-- Center Core Antenna / Radar Origin -->
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  <circle cx="256" cy="256" r="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
</svg>
